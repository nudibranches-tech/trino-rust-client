services:
  minio:
    # The upstream `minio/minio` and `minio/mc` images are gone from Docker Hub.
    # This is Bitnami's (frozen) repackaging of MinIO; its entrypoint also
    # creates the bucket and sets its anonymous policy, replacing the former
    # `mc` sidecar.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    ports:
      - "9003:9003"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_PORT_NUMBER: "9003"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
      # `<bucket>:<anonymous policy>`, applied with `mc anonymous set`.
      MINIO_DEFAULT_BUCKETS: "spooling:download"
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      - trino-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9003'"]
      interval: 30s
      timeout: 20s
      retries: 3

  coordinator:
    image: trinodb/trino:478
    ports:
      - "8080:8080"
    volumes:
      - ./trino/etc/coordinator:/etc/trino
    environment:
      - JAVA_OPTS=-Xmx1G -XX:+UseG1GC -XX:G1HeapRegionSize=32M
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - trino-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  trino-network:
    driver: bridge

volumes:
  minio_data:
  trino_coordinator_data:
